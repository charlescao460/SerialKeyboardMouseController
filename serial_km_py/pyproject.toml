[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-km"
version = "0.1.0"
description = "Synchronous Python client for SerialKeyboardMouseController serial HID hardware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SerialKeyboardMouseController contributors" }
]
dependencies = [
  "pyserial>=3.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "opencv-python>=4.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
